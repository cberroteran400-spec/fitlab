<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitLab - Videos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:white;font-family:system-ui;padding:16px}
.header{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.logo{background:#22c55e;color:black;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-weight:bold}
.search-bar{display:flex;gap:8px;margin-bottom:16px}
.search-bar input{flex:1;background:#1a1a1a;border:1px solid #333;border-radius:24px;padding:12px 16px;color:white;outline:none}
.search-bar button{background:#22c55e;border:none;border-radius:24px;padding:0 20px;font-weight:bold;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:16px}
.chips button{background:#1a1a1a;border:1px solid #333;color:#ccc;padding:8px 14px;border-radius:20px;white-space:nowrap;cursor:pointer}
.chips button.active{background:#22c55e;color:black;border-color:#22c55e}
.videos-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.video-card{background:#141414;border-radius:12px;overflow:hidden;cursor:pointer;border:1px solid #222}
.video-card img{width:100%;aspect-ratio:16/9;object-fit:cover}
.video-card .info{padding:10px}
.video-card h4{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.video-card p{font-size:11px;color:#888;margin-top:4px}
</style>
</head>
<body>
<div class="header"><div class="logo">F</div><div><b>Fit Lab</b><div style="font-size:11px;color:#888">Videos</div></div></div>

<div class="search-bar">
<input id="q" type="search" placeholder="Buscar videos de YouTube...">
<button id="btnBuscar">Buscar</button>
</div>

<div class="chips">
<button class="active" data-q="entrenamiento gimnasio fitness">Gimnasio</button>
<button data-q="rutina de ejercicios completa">Rutinas</button>
<button data-q="rutina en casa sin equipo">Casa</button>
<button data-q="recetas fitness nutricion proteina">Nutrición</button>
<button data-q="motivacion gym">Motivación</button>
<button data-q="como aumentar musculo hipertrofia">Músculos</button>
</div>

<div id="videos-container" class="videos-grid"></div>
<div id="status" style="text-align:center;padding:20px;color:#888"></div>

<script>
const WORKER_URL = "https://ouunfknxeiouwuzyhsqr.supabase.co/functions/v1/hyper-worker";

async function cargarVideosFitLab(query = "entrenamiento fitness gimnasio") {
  const grid = document.getElementById("videos-container");
  const status = document.getElementById("status");
  try {
    status.textContent = "Cargando videos...";
    grid.innerHTML = "";
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ q: query })
    });
    if (!res.ok) throw new Error("Worker respondió " + res.status);
    const data = await res.json();
    if (!data.success || !data.videos) throw new Error("Sin videos");
    status.textContent = "";
    data.videos.forEach(v => {
      const card = document.createElement("div");
      card.className = "video-card";
      card.innerHTML = `<img src="${v.thumbnail}"><div class="info"><h4>${v.title}</h4><p>${v.channel||''}</p></div>`;
      card.onclick = () => window.open("https://www.youtube.com/watch?v=" + v.id, "_blank");
      grid.appendChild(card);
    });
  } catch (err) {
    status.innerHTML = `<p>⚠️ No se pudieron cargar los videos.</p><p style="font-size:12px">${err.message}</p><button onclick="cargarVideosFitLab()" style="margin-top:12px;background:#22c55e;border:none;padding:10px 20px;border-radius:20px">Intentar de nuevo</button>`;
  }
}
document.getElementById("btnBuscar").onclick = () => { const q=document.getElementById("q").value.trim(); if(q) cargarVideosFitLab(q); }
document.querySelectorAll(".chips button").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".chips button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    cargarVideosFitLab(btn.dataset.q);
  }
});
cargarVideosFitLab();
</script>
</body>
</html>
