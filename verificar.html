<div style="max-width:400px; margin:40px auto; background:#111; padding:24px; border-radius:20px; color:white; text-align:center; font-family:sans-serif">
  <h2>✔ Hazte Verificado en FitLab</h2>
  <p style="color:#aaa">Consigue palomita azul y destaca tu perfil</p>
  <div style="background:#222; padding:16px; border-radius:12px; margin:20px 0; border:2px solid #00ff88">
    <h1 style="color:#00ff88">$99 MXN / mes</h1>
    <p>✅ Palomita azul oficial<br>✅ Prioridad en el feed<br>✅ Perfil de creador</p>
  </div>
  <button onclick="pagar()" style="width:100%; background:#00ff88; color:#000; font-weight:900; padding:14px; border:none; border-radius:12px; font-size:16px;">PAGAR Y VERIFICARME AHORA</button>
</div>

<script>
async function pagar() {
  // AQUÍ CONECTAS TU MERCADOPAGO O STRIPE
  // Por lo pronto para probar:
  const { data: { user } } = await supabase.auth.getUser();
  
  // Simula pago exitoso - lo marcas como verificado 30 días
  await supabase.from('profiles').update({ 
    is_verified: true, 
    verified_until: new Date(Date.now() + 30*24*60*60*1000).toISOString() 
  }).eq('id', user.id);
  
  await supabase.from('verified_subscriptions').insert({
    user_id: user.id,
    status: 'active'
  });
  
  alert('¡Felicidades! Ya eres verificado ✔');
  window.location.href = 'social.html';
}
</script>
